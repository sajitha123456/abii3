<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7fb;
            color: #222;
        }

        nav {
            background: #111827;
            color: white;
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav h2 {
            color: #38bdf8;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
        }

        nav a:hover {
            color: #38bdf8;
        }

        .hero {
            min-height: 85vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
            background: linear-gradient(135deg, #0f172a, #1e3a8a);
            color: white;
        }

        .hero h1 {
            font-size: 55px;
            margin-bottom: 20px;
        }

        .hero p {
            font-size: 20px;
            margin-bottom: 30px;
            color: #dbeafe;
        }

        .btn {
            display: inline-block;
            padding: 14px 30px;
            background: #38bdf8;
            color: #082f49;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .btn:hover {
            background: #7dd3fc;
        }

        .services {
            padding: 70px 8%;
            text-align: center;
        }

        .services h2 {
            font-size: 35px;
            margin-bottom: 40px;
        }

        .cards {
            display: flex;
            gap: 25px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .card {
            background: white;
            width: 280px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .card h3 {
            margin-bottom: 15px;
            color: #2563eb;
        }

        .contact {
            background: #111827;
            color: white;
            text-align: center;
            padding: 60px 20px;
        }

        .contact h2 {
            margin-bottom: 15px;
        }

        footer {
            background: #030712;
            color: #aaa;
            text-align: center;
            padding: 20px;
        }

        @media (max-width: 600px) {
            .hero h1 {
                font-size: 38px;
            }

            nav {
                flex-direction: column;
                gap: 15px;
            }

            nav a {
                margin: 0 8px;
            }
        }
    </style>
</head>

<body>

    <nav>
        <h2>MyWebsite</h2>

        <div>
            <a href="#home">Home</a>
            <a href="#services">Services</a>
            <a href="#contact">Contact</a>
        </div>
    </nav>

    <section class="hero" id="home">
        <div>
            <h1>Welcome to My Website</h1>
            <p>Build something amazing with us.</p>
            <a href="#services" class="btn">Get Started</a>
        </div>
    </section>

    <section class="services" id="services">
        <h2>Our Services</h2>

        <div class="cards">

            <div class="card">
                <h3>Web Design</h3>
                <p>Beautiful and responsive websites for your business.</p>
            </div>

            <div class="card">
                <h3>Development</h3>
                <p>Fast and modern websites using latest technologies.</p>
            </div>

            <div class="card">
                <h3>Support</h3>
                <p>Reliable support whenever you need help.</p>
            </div>

        </div>
    </section>

    <section class="contact" id="contact">
        <h2>Contact Us</h2>
        <p>Email: example@gmail.com</p>
        <br>
        <a href="mailto:example@gmail.com" class="btn">Send Message</a>
    </section>

    <footer>
        <p>© 2026 MyWebsite. All Rights Reserved.</p>
    </footer>

</body>
</html>
